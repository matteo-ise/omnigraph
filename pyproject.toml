[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigraph"
version = "0.1.0"
description = "Local knowledge graph across all your drives — auto-indexing, hybrid search, MCP-integrated."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "omnigraph contributors" }]
keywords = ["knowledge-graph", "local-search", "mcp", "semantic-search", "desktop-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "pathspec>=0.12",
    "watchdog>=4",
    "pypdf>=4",
    "pdfplumber>=0.11",
    "python-docx>=1",
    "openpyxl>=3.1",
    "Pillow>=10",
    "mutagen>=1.47",
    "pygments>=2.17",
    "charset-normalizer>=3",
    "sentence-transformers>=2",
    "sqlite-vec>=0.1",
    "mcp>=1",
    "fastapi>=0.111",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[project.scripts]
omnigraph = "omnigraph.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omnigraph"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
